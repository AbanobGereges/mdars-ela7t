<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b81d22" />
      <stop offset="75%" stop-color="#8b1115" />
      <stop offset="100%" stop-color="#5a080b" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe28a" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#997517" />
    </linearGradient>
    <linearGradient id="haloGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffeb99" />
      <stop offset="100%" stop-color="#e6b800" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b1115" />
      <stop offset="100%" stop-color="#4a0608" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Circular text paths -->
    <!-- Top Arc for Church Name -->
    <path id="topTextArc" d="M 60,250 A 190,190 0 1,1 440,250" fill="none" />
    <!-- Bottom Arc for Location -->
    <path id="bottomTextArc" d="M 120,380 A 190,190 0 0,0 380,380" fill="none" />
  </defs>

  <!-- Outer Ring Shadow -->
  <circle cx="250" cy="250" r="242" fill="none" stroke="#000000" stroke-opacity="0.2" stroke-width="6" />

  <!-- Outer Burgundy Frame -->
  <circle cx="250" cy="250" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8" />
  <circle cx="250" cy="250" r="228" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="3,3" />

  <!-- Inner Gold Border -->
  <circle cx="250" cy="250" r="172" fill="#9e1519" stroke="url(#goldGrad)" stroke-width="6" />

  <!-- Outer Circular Arabic Inscription -->
  <!-- Cross Left -->
  <text x="52" y="258" font-family="'Cairo', Arial, sans-serif" font-size="20" fill="url(#goldGrad)" text-anchor="middle" font-weight="900">☩</text>
  <!-- Cross Right -->
  <text x="448" y="258" font-family="'Cairo', Arial, sans-serif" font-size="20" fill="url(#goldGrad)" text-anchor="middle" font-weight="900">☩</text>

  <!-- Top Arabic Title -->
  <text fill="url(#goldGrad)" font-family="'Cairo', Arial, sans-serif" font-size="18.5" font-weight="bold" letter-spacing="0.5px">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      كنيسة السيدة العذراء مريم والقديس بولس الرسول القبطية الأرثوذكسية
    </textPath>
  </text>

  <!-- Bottom Location Inscription -->
  <text fill="url(#goldGrad)" font-family="'Cairo', Arial, sans-serif" font-size="22" font-weight="900" letter-spacing="2px">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      الحضرة الجديدة
    </textPath>
  </text>

  <!-- Inner Scene: Crimson Background -->
  <circle cx="250" cy="250" r="168" fill="url(#bgGrad)" />

  <!-- ==================== ICONS OF THE SAINTS ==================== -->
  <g id="saints">
    <!-- Halo for Virgin Mary -->
    <circle cx="175" cy="195" r="48" fill="url(#haloGrad)" stroke="#c29310" stroke-width="3" filter="url(#shadow)" />
    <circle cx="175" cy="195" r="44" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="4,2" />

    <!-- Halo for Apostle Paul -->
    <circle cx="325" cy="195" r="50" fill="url(#haloGrad)" stroke="#c29310" stroke-width="3" filter="url(#shadow)" />
    <circle cx="325" cy="195" r="50" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="4,2" />

    <!-- Halo for Infant Jesus -->
    <circle cx="215" cy="250" r="26" fill="url(#haloGrad)" stroke="#c29310" stroke-width="2" />
    <!-- Cross in Jesus Halo -->
    <path d="M 215,225 L 215,275 M 190,250 L 240,250" stroke="#8b1115" stroke-width="3" />

    <!-- 1. ST. MARY (Left) -->
    <!-- Dark Blue Maphorion / Veil -->
    <path d="M 125,350 C 120,290 135,210 175,200 C 215,210 230,290 225,350 Z" fill="#1e3a8a" stroke="#172554" stroke-width="2" />
    <path d="M 140,350 C 135,270 145,215 175,210 C 205,215 215,270 210,350 Z" fill="#2563eb" />
    <!-- Gold Trim on Maphorion -->
    <path d="M 152,225 C 165,220 185,220 198,225" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
    <path d="M 175,215 L 175,223 M 171,219 L 179,219" stroke="url(#goldGrad)" stroke-width="2" /> <!-- Star on veil -->

    <!-- Face of Virgin Mary -->
    <ellipse cx="175" cy="242" rx="19" ry="24" fill="#fcd3a1" stroke="#d97706" stroke-width="1.5" />
    <!-- Features -->
    <path d="M 166,238 Q 170,235 174,238 M 176,238 Q 180,235 184,238" stroke="#78350f" stroke-width="1.5" fill="none" />
    <circle cx="170" cy="241" r="2" fill="#451a03" />
    <circle cx="180" cy="241" r="2" fill="#451a03" />
    <path d="M 175,241 L 174,250 L 177,250" stroke="#b45309" stroke-width="1.2" fill="none" />
    <path d="M 171,256 Q 175,259 179,256" stroke="#b91c1c" stroke-width="1.5" fill="none" />

    <!-- 2. INFANT JESUS -->
    <!-- White / Gold / Red Garments -->
    <path d="M 195,340 C 190,295 200,265 215,265 C 230,265 240,295 235,340 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M 205,285 C 215,280 230,300 225,340 Z" fill="#dc2626" />
    <ellipse cx="215" cy="265" rx="14" ry="16" fill="#fcd3a1" stroke="#d97706" stroke-width="1.5" />
    <!-- Jesus Features -->
    <circle cx="211" cy="264" r="1.5" fill="#451a03" />
    <circle cx="219" cy="264" r="1.5" fill="#451a03" />
    <path d="M 212,274 Q 215,276 218,274" stroke="#b91c1c" stroke-width="1.2" fill="none" />
    <!-- Gospel in Jesus' hand -->
    <rect x="202" y="280" width="16" height="20" rx="2" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="1.5" />
    <path d="M 210,283 L 210,297 M 205,290 L 215,290" stroke="url(#goldGrad)" stroke-width="1.5" />

    <!-- 3. ST. PAUL THE APOSTLE (Right) -->
    <!-- Garments: Green tunic & cream cloak -->
    <path d="M 270,350 C 275,270 295,210 325,205 C 355,210 375,270 380,350 Z" fill="#14532d" stroke="#052e16" stroke-width="2" />
    <path d="M 280,350 C 285,280 295,230 310,230 C 330,230 340,280 345,350 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    
    <!-- St. Paul Face -->
    <ellipse cx="325" cy="235" rx="21" ry="26" fill="#fcd3a1" stroke="#d97706" stroke-width="1.5" />
    <!-- Brown Long Apostolic Beard -->
    <path d="M 306,238 C 304,275 315,310 325,318 C 335,310 346,275 344,238 C 335,248 315,248 306,238 Z" fill="#5c2c16" stroke="#3b1706" stroke-width="1.5" />
    <path d="M 314,248 C 318,280 325,305 325,305 C 325,305 332,280 336,248" fill="none" stroke="#78350f" stroke-width="1.5" />
    <!-- St. Paul Forehead & Eyes -->
    <path d="M 314,228 Q 319,225 324,228 M 326,228 Q 331,225 336,228" stroke="#78350f" stroke-width="1.5" fill="none" />
    <circle cx="319" cy="232" r="2" fill="#451a03" />
    <circle cx="331" cy="232" r="2" fill="#451a03" />
    <path d="M 325,231 L 324,244 L 327,244" stroke="#b45309" stroke-width="1.2" fill="none" />

    <!-- St. Paul Attributes: Golden Cross (Right Hand) & Epistles Scroll (Left Hand) -->
    <!-- Golden Cross held in hand -->
    <g transform="translate(305, 275) rotate(-10)">
      <path d="M 0,-30 L 0,35 M -15,-15 L 15,-15" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
      <circle cx="0" cy="-15" r="3" fill="#8b1115" />
    </g>
    <!-- St. Paul Epistles Scroll / Papers (Held on left arm) -->
    <g transform="translate(345, 260) rotate(20)">
      <rect x="0" y="0" width="28" height="65" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="2" />
      <!-- Scroll lines (Epistles text) -->
      <line x1="5" y1="12" x2="23" y2="12" stroke="#854d0e" stroke-width="2" />
      <line x1="5" y1="20" x2="23" y2="20" stroke="#854d0e" stroke-width="2" />
      <line x1="5" y1="28" x2="23" y2="28" stroke="#854d0e" stroke-width="2" />
      <line x1="5" y1="36" x2="23" y2="36" stroke="#854d0e" stroke-width="2" />
      <line x1="5" y1="44" x2="23" y2="44" stroke="#854d0e" stroke-width="2" />
      <line x1="5" y1="52" x2="18" y2="52" stroke="#854d0e" stroke-width="2" />
    </g>
  </g>

  <!-- ==================== HORIZONTAL RIBBON / BANNER ==================== -->
  <g id="ribbon" filter="url(#shadow)">
    <!-- Ribbon Tail Left -->
    <polygon points="10,385 45,365 45,415 10,410 25,397" fill="#4a0608" stroke="url(#goldGrad)" stroke-width="2" />
    <!-- Ribbon Tail Right -->
    <polygon points="490,385 455,365 455,415 490,410 475,397" fill="#4a0608" stroke="url(#goldGrad)" stroke-width="2" />

    <!-- Main Ribbon Body -->
    <path d="M 35,370 Q 250,385 465,370 L 460,420 Q 250,435 40,420 Z" fill="url(#ribbonGrad)" stroke="url(#goldGrad)" stroke-width="3" />
    <!-- Inner Ribbon Gold Border -->
    <path d="M 45,376 Q 250,391 455,376 M 48,414 Q 250,429 452,414" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />

    <!-- English Ribbon Text -->
    <text x="250" y="405" font-family="'Arial Rounded MT Bold', Arial, sans-serif" font-size="27" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1.5px">
      St.Mary &amp; St.Poul church
    </text>
  </g>
</svg>
