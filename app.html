<body class="bg-[#fbf7ee] text-slate-800 min-h-screen antialiased selection:bg-church-200">

  <!-- APP ROOT CONTAINER -->
  <div id="app-root">
    <!-- Initial Loading Fallback -->
    <div class="min-h-screen flex flex-col items-center justify-center p-4 gap-3 text-center">
      <img src="church-logo.jpg" onerror="this.onerror=null; this.src='church-logo.svg';" class="w-24 h-24 rounded-full shadow-xl border-2 border-amber-500 object-cover mx-auto animate-pulse" alt="شعار كنيسة العذراء وبولس" />
      <div class="w-10 h-10 border-4 border-amber-300 border-t-amber-600 rounded-full animate-spin mx-auto mt-2"></div>

      <div id="loading-timeout-hint" class="hidden flex flex-col items-center gap-2 mt-2">
        <p class="text-[11px] text-slate-400">إذا استغرقت الشاشة وقتاً:</p>
        <button onclick="localStorage.clear(); location.reload();" class="px-4 py-2 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold text-xs border border-amber-300 shadow-sm transition-all active:scale-95">
          🔄 إعادة المحاولة / ضبط الإعدادات

  <script>
    setTimeout(function() {
      var hint = document.getElementById('loading-timeout-hint');
      if (hint) hint.classList.remove('hidden');
    }, 3500);
  </script>

  <script>
    // Global Error Trap to PREVENT any White Screen
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      console.error('Global uncaught error caught:', msg, error);
      const root = document.getElementById('app-root');
      if (root) {
        root.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-4 bg-[#fbf7ee]" dir="rtl">
            <div class="bg-white max-w-lg w-full rounded-3xl p-6 border border-rose-300 shadow-2xl space-y-4 text-right">
              <div class="w-12 h-12 rounded-2xl bg-rose-100 text-rose-700 flex items-center justify-center text-2xl mx-auto font-bold">⚠️</div>
              <h2 class="text-xl font-black text-rose-950 text-center">تنبيه أثناء تشغيل الواجهة</h2>
              <p class="text-xs text-slate-600 font-mono bg-rose-50 p-3 rounded-xl border border-rose-200" dir="ltr">${msg}</p>
              <div class="flex gap-2">
                <button onclick="location.reload()" class="flex-1 py-2.5 bg-church-600 text-white rounded-xl text-xs font-bold">
                  إعادة المحاولة
                </button>
                <button onclick="localStorage.clear(); location.reload();" class="px-4 py-2.5 border border-slate-300 text-slate-700 rounded-xl text-xs font-bold">
                  إعادة ضبط الإعدادات
                </button>
              </div>
            </div>
          </div>
        `;
      }
    };

    window.addEventListener('unhandledrejection', function(event) {
      console.warn('Unhandled Promise Rejection:', event.reason);
    });

    // ===========================================================================
    // 1. SUPABASE CLIENT & STATE INITIALIZATION
    // ===========================================================================
    var supabaseClient = null;
    var currentUser = null;
    var currentProfile = null;
    var currentRole = null;
    var assignedFamilyIds = [];
    var assignedGroupIds = [];
    var assignedStageIds = [];
    var currentAdminTab = 'dashboard'; // 'dashboard' | 'users' | 'stages' | 'families' | 'children' | 'rules' | 'audit'
    var currentServantTab = 'kids'; // 'kids' | 'history'
    var isDisplayOnlyMode = false;
    var selectedDisplayFilter = localStorage.getItem('CHURCH_DISPLAY_FILTER') || 'all';
    var isDisplaySlideshowActive = false;
    var displaySlideshowTimer = null;
    var displaySlideshowCountdown = 15;
    var displaySlideshowCountdownInterval = null;

    // Realtime Cache
    var cacheChildren = [];
    var cacheFamilies = [];
    var cacheStages = [];
    var cacheRules = [];
    var cacheLogs = [];
    var cacheProfiles = [];
    var cacheFamilyServants = [];
    var cacheGroups = [];
    var cacheGroupStages = [];
    var cacheGroupServants = [];
    var realtimeChannel = null;
    var realtimeSyncDebounceTimer = null;
    var isRealtimeConnected = false;

    // Web Audio Synthesizer
    class SoundManager {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      playSuccess() {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.15);
          osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.3);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.4);
        } catch(e) {}
      }
      playDeduct() {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(260, now + 0.25);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.3);
        } catch(e) {}
      }
    }
    const sounds = new SoundManager();

    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 90,
          spread: 80,
          origin: { y: 0.6 },
          colors: ['#d0a753', '#b88936', '#3377fc', '#10b981', '#f59e0b']
        });
      }
    }

    function getSupabaseLib() {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        return window.supabase;
      }
      return null;
    }

    function cleanSupabaseUrl(raw) {
      if (!raw) return '';
      let url = raw.trim();

      const dashboardMatch = url.match(/supabase\.com\/dashboard\/project\/([a-zA-Z0-9_-]+)/);
      if (dashboardMatch && dashboardMatch[1]) {
        return `https://${dashboardMatch[1]}.supabase.co`;
      }

      if (!/^https?:\/\//i.test(url)) {
        url = 'https://' + url;
      }

      try {
        const parsed = new URL(url);
        return parsed.origin;
      } catch (e) {
        return url.replace(/\/+$/, '');
      }
    }

    const DEFAULT_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indib3phYmN1YXBxemZraXR5eWdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNjEzOTMsImV4cCI6MjEwMzkzNzM5M30.iPPxVZu3dNfEUYMQWUr3qOq4A1FfqlYEndJB9pjPIKc';
    const DEFAULT_SUPABASE_URL = 'https://wbozabcuapqzfkityygf.supabase.co';

    function initSupabase() {
      let key = localStorage.getItem('CHURCH_SUPABASE_KEY') || DEFAULT_SUPABASE_KEY;
      if (!key || key.includes('dummy') || key.includes('placeholder')) key = DEFAULT_SUPABASE_KEY;
      key = key.trim();

      // Automatically extract the exact project ref from the JWT payload to eliminate any typo
      let derivedUrl = DEFAULT_SUPABASE_URL;
      try {
        const parts = key.split('.');
        if (parts.length >= 2) {
          const payload = JSON.parse(atob(parts[1]));
          if (payload && payload.ref) {
            derivedUrl = `https://${payload.ref}.supabase.co`;
          }
        }
      } catch (e) {
        console.warn('JWT ref extract warning:', e);
      }

      let url = localStorage.getItem('CHURCH_SUPABASE_URL');
      if (!url || url.includes('xyz') || url.includes('placeholder') || url.includes('fkkityygf')) {
        url = derivedUrl;
      }
      url = cleanSupabaseUrl(url);

      // Persist the clean, verified URL and key in localStorage
      localStorage.setItem('CHURCH_SUPABASE_URL', url);
      localStorage.setItem('CHURCH_SUPABASE_KEY', key);

      const lib = getSupabaseLib();
      if (url && key && lib) {
        try {
          supabaseClient = lib.createClient(url, key);
          console.info('Supabase initialized successfully with endpoint:', url);
          return true;
        } catch (e) {
          console.error('Init error:', e);
          return false;
        }
      }
      return false;
    }

    async function waitForSupabaseLib(maxRetries = 30, delayMs = 100) {
      for (let i = 0; i < maxRetries; i++) {
        if (getSupabaseLib()) return true;
        await new Promise(res => setTimeout(res, delayMs));
      }
      return !!getSupabaseLib();
    }

    // ===========================================================================
    // 2. MAIN APPLICATION BOOTSTRAP
    // ===========================================================================
    async function initApp() {
      await waitForSupabaseLib();
      const configured = initSupabase();
      if (!configured) {
        renderConfigSetup();
        return;
      }

      renderLoading('جاري التحقق من الجلسة والصلاحيات...');

      try {
        const sessionPromise = supabaseClient.auth.getSession();
        const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('Session check timeout')), 6000));
        const { data: sessionData, error: sessionErr } = await Promise.race([sessionPromise, timeoutPromise]);
        if (sessionErr) throw sessionErr;

        if (sessionData && sessionData.session && sessionData.session.user) {
          currentUser = sessionData.session.user;
          await loadUserProfile(currentUser.id);
        } else {
          renderLogin();
          return;
        }
      } catch (err) {
        console.warn('Session check note:', err);
        renderLogin();
        return;
      }

      // Check approval
      if (!currentProfile || !currentProfile.is_approved) {
        renderUnapproved();
        return;
      }

      // Setup Realtime & Load data with safe timeout
      try {
        await Promise.race([
          loadAllData(),
          new Promise((_, reject) => setTimeout(() => reject(new Error('Data load timeout')), 8000))
        ]);
      } catch (e) {
        console.warn('Initial loadAllData note:', e);
      }

      setupRealtime();

      // Route based on role
      if (isDisplayOnlyMode || currentRole === 'display') {
        renderDisplayScreen();
      } else if (currentRole === 'admin') {
        renderAdminDashboard();
      } else {
        renderServantHome();
      }
    }

    async function loadUserProfile(userId) {
      try {
        const { data, error } = await supabaseClient
          .from('profiles')
          .select('*')
          .eq('id', userId)
          .maybeSingle();

        if (data) {
          currentProfile = data;
          currentRole = data.role;

          if (currentRole === 'servant') {
            const [fsRes, gsRes] = await Promise.all([
              supabaseClient.from('family_servants').select('family_id').eq('servant_id', userId),
              supabaseClient.from('group_servants').select('group_id').eq('servant_id', userId)
            ]);
            assignedFamilyIds = fsRes.data ? fsRes.data.map(item => item.family_id) : [];
            assignedGroupIds = gsRes.data ? gsRes.data.map(item => item.group_id) : [];

            if (assignedGroupIds.length > 0) {
              const { data: gstData } = await supabaseClient
                .from('group_stages')
                .select('stage_id')
                .in('group_id', assignedGroupIds);
              assignedStageIds = gstData ? [...new Set(gstData.map(item => item.stage_id))] : [];
            } else {
              assignedStageIds = [];
            }
          } else if (currentRole === 'admin') {
            const { data: fams } = await supabaseClient.from('families').select('id');
            assignedFamilyIds = fams ? fams.map(f => f.id) : [];
            assignedStageIds = [];
            assignedGroupIds = [];
          }
        } else {
          const metaName = (currentUser.user_metadata && currentUser.user_metadata.full_name) || 'مستخدم جديد';
          currentProfile = { id: userId, email: currentUser.email, full_name: metaName, role: 'servant', is_approved: false };
          currentRole = 'servant';
          try {
            await supabaseClient.from('profiles').upsert(currentProfile, { onConflict: 'id' });
          } catch (e) {
            console.warn('Upsert profile fallback note:', e);
          }
        }
      } catch (err) {
        console.error('loadUserProfile error:', err);
      }
    }

    async function loadAllData() {
      if (!supabaseClient) return;
      try {
        const [chRes, famRes, stgRes, ruleRes, logRes, profRes, fsRes, grpRes, gstgRes, gservRes, dispRes] = await Promise.all([
          supabaseClient.from('children').select('*').order('full_name'),
          supabaseClient.from('families').select('*').order('name'),
          supabaseClient.from('stages').select('*').order('sort_order'),
          supabaseClient.from('point_rules').select('*').order('points', { ascending: false }),
          supabaseClient.from('point_logs').select('*').order('created_at', { ascending: false }),
          supabaseClient.from('profiles').select('*').order('created_at'),
          supabaseClient.from('family_servants').select('*'),
          supabaseClient.from('groups').select('*').order('created_at', { ascending: true }),
          supabaseClient.from('group_stages').select('*'),
          supabaseClient.from('group_servants').select('*'),
          supabaseClient.from('display_settings').select('*').eq('id', 'current_display_config').maybeSingle()
        ]);

        if (dispRes && dispRes.data) {
          applyRemoteDisplaySettingsRow(dispRes.data);
        }

        if (logRes.error) console.error('[loadAllData] point_logs query error:', logRes.error);
        if (chRes.error) console.error('[loadAllData] children query error:', chRes.error);
        if (ruleRes.error) console.error('[loadAllData] point_rules query error:', ruleRes.error);

        cacheStages = stgRes.data || [];
        cacheGroups = grpRes.data || [];
        cacheGroupStages = gstgRes.data || [];
        cacheGroupServants = gservRes.data || [];
        cacheFamilies = (famRes.data || []).map(f => ({
          ...f,
          stage: cacheStages.find(s => s.id === f.stage_id) || { name: '' }
        }));
        cacheChildren = (chRes.data || []).map(c => ({
          ...c,
          family: cacheFamilies.find(f => f.id === c.family_id) || { name: '' },
          stage: cacheStages.find(s => s.id === c.stage_id) || { name: '' }
        }));
        cacheRules = ruleRes.data || [];
        cacheProfiles = profRes.data || [];
        cacheFamilyServants = fsRes.data || [];

        // Enrich point_logs in memory so every log has full child, family, stage, servant
        cacheLogs = (logRes.data || []).map(l => ({
          ...l,
          child: cacheChildren.find(c => c.id === l.child_id) || { full_name: 'طفل' },
          family: cacheFamilies.find(f => f.id === l.family_id) || { name: '' },
          stage: cacheStages.find(s => s.id === l.stage_id) || { name: '' },
          servant: cacheProfiles.find(p => p.id === l.servant_id) || { full_name: 'خادم' }
        }));

        if (cacheFamilies && cacheFamilies.length > 0) {
          try {
            localStorage.setItem('CHURCH_CACHED_FAMILIES', JSON.stringify(cacheFamilies));
          } catch(e) {}
        }
      } catch (err) {
        console.error('Data loading error:', err);
      }
    }

    // ===========================================================================
    // REALTIME ENGINE (FINE-GRAINED STATE UPDATES & RECONNECT RESILIENCE)
    // ===========================================================================
    function teardownRealtime() {
      if (realtimeChannel && supabaseClient) {
        try {
          supabaseClient.removeChannel(realtimeChannel);
        } catch (err) {
          console.warn('Realtime teardown error:', err);
        }
        realtimeChannel = null;
      }
      isRealtimeConnected = false;
      updateRealtimeIndicator(false, 'غير متصل');
    }

    function updateRealtimeIndicator(isOnline, text) {
      document.querySelectorAll('.realtime-indicator-badge').forEach(badge => {
        badge.className = `realtime-indicator-badge inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold transition-all ${
          isOnline ? 'bg-emerald-50 border border-emerald-200 text-emerald-800' : 'bg-amber-50 border border-amber-200 text-amber-800'
        }`;
        badge.innerHTML = `
          <span class="w-2 h-2 rounded-full ${isOnline ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}"></span>
          <span>${text || (isOnline ? 'بث مباشر Realtime' : 'جاري الاتصال...')}</span>
        `;
      });
    }

    function setupRealtime() {
      if (!supabaseClient) return;

      // Prevent duplicate channel subscriptions on re-render / tab switch
      if (realtimeChannel) {
        return;
      }

      console.log('⚡ Initializing Supabase Realtime Hub for 7 tables...');
      updateRealtimeIndicator(false, 'جاري الاتصال بالبث المباشر...');

      realtimeChannel = supabaseClient
        .channel('church-system-realtime-hub', {
          config: { broadcast: { self: true } }
        })

        // 1. POINT_LOGS TABLE (Points added / deducted / reverted)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'point_logs' }, (payload) => {
          console.log('[Realtime point_logs]:', payload.eventType, payload);

          if (payload.eventType === 'INSERT') {
            const log = payload.new;
            log.child = cacheChildren.find(c => c.id === log.child_id) || { full_name: 'طفل' };
            log.family = cacheFamilies.find(f => f.id === log.family_id) || { name: '' };
            log.stage = cacheStages.find(s => s.id === log.stage_id) || { name: '' };
            log.servant = cacheProfiles.find(p => p.id === log.servant_id) || { full_name: 'خادم' };

            const existIdx = cacheLogs.findIndex(l => l.id === log.id || (l.id.startsWith('temp-') && l.child_id === log.child_id && l.points === log.points));
            if (existIdx >= 0) {
              cacheLogs[existIdx] = log;
            } else {
              cacheLogs.unshift(log);
              // Audio feedback for remote operations
              if (log.servant_id !== currentUser?.id) {
                if (log.points > 0) {
                  sounds.playSuccess();
                  triggerConfetti();
                  showToast(`🎉 خادم سجّل ${log.points > 0 ? '+' + log.points : log.points} نقطة لـ (${log.child?.full_name || 'طفل'})`, true);
                } else {
                  sounds.playDeduct();
                  showToast(`⚠️ خادم خصم ${Math.abs(log.points)} نقطة من (${log.child?.full_name || 'طفل'})`, false);
                }
              }
            }
          } else if (payload.eventType === 'UPDATE') {
            const updatedLog = payload.new;
            const idx = cacheLogs.findIndex(l => l.id === updatedLog.id);
            if (idx >= 0) {
              cacheLogs[idx] = { ...cacheLogs[idx], ...updatedLog };
            }
          } else if (payload.eventType === 'DELETE') {
            const delId = payload.old?.id;
            cacheLogs = cacheLogs.filter(l => l.id !== delId);
          }

          refreshCurrentView();
          scheduleBackgroundReconcile();
        })

        // 2. CHILDREN TABLE (Add, Edit, Transfer family/stage, Toggle active, Image change)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'children' }, (payload) => {
          console.log('[Realtime children]:', payload.eventType, payload);

          if (payload.eventType === 'INSERT') {
            const newChild = payload.new;
            newChild.family = cacheFamilies.find(f => f.id === newChild.family_id) || { name: '' };
            newChild.stage = cacheStages.find(s => s.id === newChild.stage_id) || { name: '' };
            const idx = cacheChildren.findIndex(c => c.id === newChild.id || (c.id.startsWith('child-') && c.full_name === newChild.full_name));
            if (idx >= 0) {
              cacheChildren[idx] = newChild;
            } else {
              cacheChildren.unshift(newChild);
              showToast(`👶 تم تسجيل طفل جديد: (${newChild.full_name})`, true);
            }
          } else if (payload.eventType === 'UPDATE') {
            const updatedChild = payload.new;
            updatedChild.family = cacheFamilies.find(f => f.id === updatedChild.family_id) || { name: '' };
            updatedChild.stage = cacheStages.find(s => s.id === updatedChild.stage_id) || { name: '' };
            const idx = cacheChildren.findIndex(c => c.id === updatedChild.id);
            if (idx >= 0) {
              cacheChildren[idx] = { ...cacheChildren[idx], ...updatedChild };
            } else {
              cacheChildren.unshift(updatedChild);
            }

            // Propagate updated child & family details to existing point_logs
            cacheLogs.forEach(l => {
              if (l.child_id === updatedChild.id) {
                l.child = updatedChild;
                l.family = updatedChild.family;
                l.stage = updatedChild.stage;
              }
            });
          } else if (payload.eventType === 'DELETE') {
            const delId = payload.old?.id;
            cacheChildren = cacheChildren.filter(c => c.id !== delId);
            cacheLogs = cacheLogs.filter(l => l.child_id !== delId);
          }

        // 3. FAMILIES TABLE (Add, Rename, Change stage, Delete)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'families' }, (payload) => {
          console.log('[Realtime families]:', payload.eventType, payload);

          if (payload.eventType === 'INSERT') {
            const newFam = payload.new;
            newFam.stage = cacheStages.find(s => s.id === newFam.stage_id) || { name: '' };
            const idx = cacheFamilies.findIndex(f => f.id === newFam.id);
            if (idx >= 0) cacheFamilies[idx] = newFam; else cacheFamilies.push(newFam);
          } else if (payload.eventType === 'UPDATE') {
            const updatedFam = payload.new;
            updatedFam.stage = cacheStages.find(s => s.id === updatedFam.stage_id) || { name: '' };
            const idx = cacheFamilies.findIndex(f => f.id === updatedFam.id);
            if (idx >= 0) cacheFamilies[idx] = { ...cacheFamilies[idx], ...updatedFam };

            // Update in children & logs
            cacheChildren.forEach(c => {
              if (c.family_id === updatedFam.id) c.family = updatedFam;
            });
            cacheLogs.forEach(l => {
              if (l.family_id === updatedFam.id) l.family = updatedFam;
            });
          } else if (payload.eventType === 'DELETE') {
            const delId = payload.old?.id;
            cacheFamilies = cacheFamilies.filter(f => f.id !== delId);

          refreshCurrentView();
          scheduleBackgroundReconcile();

    // ===========================================================================
    // 3. COMPUTATIONS (HEROES OF THE DAY & STRICT STAGE/GROUP ISOLATION)
    // ===========================================================================
    function computeTodayStats(filterStageIds = null) {
      const now = new Date();
      const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();

      const childTodayMap = new Map();
      const childTotalMap = new Map();
      const childLastPointMap = new Map();
      const familyTodayMap = new Map();
      const familyTotalMap = new Map();
      let grandTotalToday = 0;

      // 1. Process point logs strictly for allowed stages if filter is active
      cacheLogs.forEach(log => {
        if (log.is_reverted) return;

        // Stage isolation check
        if (filterStageIds && filterStageIds.length > 0) {
          let logStage = log.stage_id;
          if (!logStage) {
            if (log.child_id) {
              const ch = cacheChildren.find(c => c.id === log.child_id);
              logStage = ch?.stage_id;
            } else if (log.family_id) {
              const fam = cacheFamilies.find(f => f.id === log.family_id);
              logStage = fam?.stage_id;
            }
          }
          if (logStage && !filterStageIds.includes(logStage)) return;
        }

        const pts = log.points || 0;
        const time = new Date(log.created_at).getTime();

        if (log.child_id) {
          childTotalMap.set(log.child_id, (childTotalMap.get(log.child_id) || 0) + pts);
        }
        if (log.family_id) {
          familyTotalMap.set(log.family_id, (familyTotalMap.get(log.family_id) || 0) + pts);
        }

        if (time >= startOfToday) {
          if (log.child_id) {
            childTodayMap.set(log.child_id, (childTodayMap.get(log.child_id) || 0) + pts);
          }
          if (log.family_id) {
            familyTodayMap.set(log.family_id, (familyTodayMap.get(log.family_id) || 0) + pts);
          }
          grandTotalToday += pts;

          if (log.child_id) {
            const currentLast = childLastPointMap.get(log.child_id);
            if (!currentLast || time > new Date(currentLast).getTime()) {
              childLastPointMap.set(log.child_id, log.created_at);
            }
          }
        }
      });

      // 2. Strict Child Isolation: Only include children belonging to the requested stages
      const eligibleChildren = cacheChildren.filter(c => {
        if (!c.is_active) return false;
        if (filterStageIds && filterStageIds.length > 0 && !filterStageIds.includes(c.stage_id)) return false;
        return true;
      });

      const childrenWithPoints = eligibleChildren.map(c => ({
        child: c,
        pointsToday: childTodayMap.get(c.id) || 0,
        pointsTotal: childTotalMap.get(c.id) || 0,
        lastPointAt: childLastPointMap.get(c.id) || null
      }));

      // Sort: 1) Points today DESC, 2) Last transaction DESC, 3) Name ASC
      childrenWithPoints.sort((a, b) => {
        if (b.pointsToday !== a.pointsToday) return b.pointsToday - a.pointsToday;
        const timeA = a.lastPointAt ? new Date(a.lastPointAt).getTime() : 0;
        const timeB = b.lastPointAt ? new Date(b.lastPointAt).getTime() : 0;
        if (timeB !== timeA) return timeB - timeA;
        return (a.child.full_name || '').localeCompare(b.child.full_name || '', 'ar');
      });

      // Top 3 Heroes: Only children who have earned points today (> 0)
      const kidsWithScoreToday = childrenWithPoints.filter(c => c.pointsToday > 0);
      const top3ChildrenToday = kidsWithScoreToday.length > 0 ? kidsWithScoreToday.slice(0, 3) : [];

      // 3. Strict Family Isolation: Only include families belonging to the requested stages
      const eligibleFamilies = cacheFamilies.filter(f => {
        if (!f.is_active) return false;
        if (filterStageIds && filterStageIds.length > 0 && !filterStageIds.includes(f.stage_id)) return false;
        return true;
      });

      const familiesWithPoints = eligibleFamilies.map(f => {
        const count = cacheChildren.filter(c => c.family_id === f.id && c.is_active).length;
        return {
          family: f,
          pointsToday: familyTodayMap.get(f.id) || 0,
          pointsTotal: familyTotalMap.get(f.id) || 0,
          childrenCount: count
        };
      });

      familiesWithPoints.sort((a, b) => {
        if (b.pointsToday !== a.pointsToday) return b.pointsToday - a.pointsToday;
        return (a.family.name || '').localeCompare(b.family.name || '', 'ar');
      });

      const famsWithScoreToday = familiesWithPoints.filter(f => f.pointsToday > 0);
      const top3FamiliesToday = famsWithScoreToday.length > 0 ? famsWithScoreToday.slice(0, 3) : familiesWithPoints.slice(0, 3);

      return {
        childrenWithPoints,
        top3ChildrenToday,
        familiesWithPoints,
        top3FamiliesToday,
        grandTotalToday
      };
    }

    // Safety fallback: expose stats globally on window
    try {
      Object.defineProperty(window, 'stats', {
        get: function() { return computeTodayStats(); },
        configurable: true
      });
    } catch (e) {
      window.stats = null;
    }

    // DISPLAY SCREEN CONTROL HELPERS (عزل شاشات العرض والتحكم الكامل)

    function getDisplayAllowedStages() {
      if (!selectedDisplayFilter || selectedDisplayFilter === 'all') {
        return {
          type: 'all',
          stageIds: null,
          title: 'الترتيب العام — كافة المراحل والأسر',
          subtitle: 'عرض عام شامل لجميع المراحل والمجموعات في الخدمة',
          group: null,
          stage: null
        };
      }

      if (selectedDisplayFilter.startsWith('group:')) {
        const groupId = selectedDisplayFilter.split(':')[1];
        const grp = cacheGroups.find(g => g.id === groupId);
        if (!grp) {
          return { type: 'all', stageIds: null, title: 'الترتيب العام — كافة المراحل والأسر', subtitle: '', group: null };
        }
        const stageIds = cacheGroupStages.filter(gs => gs.group_id === grp.id).map(gs => gs.stage_id);
        const linkedStages = cacheStages.filter(s => stageIds.includes(s.id));
        const stagesText = linkedStages.map(s => s.name).join(' • ') || 'بدون مراحل';
        return {
          type: 'group',
          stageIds: stageIds,
          title: `🏆 أبطال اليوم — ${grp.name}`,
          subtitle: `✨ شاشة مستقلة لمجموعة: ${grp.name} (${stagesText}) — معزولة تماماً ✨`,
          group: grp,
          stages: linkedStages
        };
      }

      if (selectedDisplayFilter.startsWith('stage:')) {
        const stageId = selectedDisplayFilter.split(':')[1];
        const stg = cacheStages.find(s => s.id === stageId);
        if (!stg) {
          return { type: 'all', stageIds: null, title: 'الترتيب العام — كافة المراحل والأسر', subtitle: '', stage: null };
        }
        return {
          type: 'stage',
          stageIds: [stg.id],
          title: `🏆 أبطال اليوم — مرحلة ${stg.name}`,
          subtitle: `✨ شاشة مخصصة لمرحلة: ${stg.name} فقط ✨`,
          stage: stg
        };
      }

      return { type: 'all', stageIds: null, title: 'الترتيب العام', subtitle: '', group: null };
    }

    function setDisplayFilter(filterId) {
      if (isDisplaySlideshowActive) {
        stopDisplaySlideshow();
      }
      selectedDisplayFilter = filterId;
      localStorage.setItem('CHURCH_DISPLAY_FILTER', filterId);
      renderDisplayScreen();
    }

    function lockDisplayScreenGroup() {
      localStorage.setItem('CHURCH_DISPLAY_FILTER', selectedDisplayFilter);
      const info = getDisplayAllowedStages();
      const targetName = info.group?.name || info.stage?.name || 'الترتيب العام الشامل';
      showToast(`✓ تم تثبيت هذه الشاشة/الجهاز على: (${targetName}) بنجاح! ستفتح دائماً على هذه المجموعة`, true);
    }

    function toggleDisplaySlideshow() {
      if (isDisplaySlideshowActive) {
        stopDisplaySlideshow();
      } else {
        startDisplaySlideshow();
      }
    }

    function startDisplaySlideshow() {
      const activeGroups = cacheGroups.filter(g => g.is_active);
      if (activeGroups.length === 0) {
        alert('لا توجد مجموعات نشطة للتبديل بينها. يرجى تفعيل مجموعة واحدة على الأقل من لوحة الإدارة.');
        return;
      }
      isDisplaySlideshowActive = true;
      displaySlideshowCountdown = 15;

      clearInterval(displaySlideshowTimer);
      clearInterval(displaySlideshowCountdownInterval);

      displaySlideshowCountdownInterval = setInterval(() => {
        displaySlideshowCountdown--;
        if (displaySlideshowCountdown <= 0) {
          displaySlideshowCountdown = 15;
        }
        const countdownEl = document.getElementById('slideshow-countdown-text');
        if (countdownEl) countdownEl.textContent = displaySlideshowCountdown + 's';
      }, 1000);

      displaySlideshowTimer = setInterval(() => {
        const active = cacheGroups.filter(g => g.is_active);
        if (active.length === 0) return;
        const currentGid = selectedDisplayFilter.startsWith('group:') ? selectedDisplayFilter.split(':')[1] : null;
        const currentIdx = active.findIndex(g => g.id === currentGid);
        const nextIdx = (currentIdx + 1) % active.length;
        selectedDisplayFilter = 'group:' + active[nextIdx].id;
        displaySlideshowCountdown = 15;
        renderDisplayScreen();
      }, 15000);

      renderDisplayScreen();
    }

    function stopDisplaySlideshow() {
      isDisplaySlideshowActive = false;
      clearInterval(displaySlideshowTimer);
      clearInterval(displaySlideshowCountdownInterval);
      renderDisplayScreen();
    }

    function openGroupDisplayScreen(groupId) {
      if (isDisplaySlideshowActive) stopDisplaySlideshow();
      selectedDisplayFilter = 'group:' + groupId;
      localStorage.setItem('CHURCH_DISPLAY_FILTER', selectedDisplayFilter);
      isDisplayOnlyMode = true;
      renderDisplayScreen();
    }

    // ===========================================================================
    // 3.5 CENTRALIZED DISPLAY REMOTE CONTROL BROADCAST FUNCTIONS
    // ===========================================================================
    var displaySlideshowIntervalSec = 15;

    async function broadcastDisplayFilter(filterId, slideshowActive = false, intervalSec = displaySlideshowIntervalSec) {
      if (slideshowActive) {
        startDisplaySlideshow();
      } else if (isDisplaySlideshowActive) {
        stopDisplaySlideshow();
      }

      selectedDisplayFilter = filterId;
      localStorage.setItem('CHURCH_DISPLAY_FILTER', filterId);

      let mode = 'all';
      let targetId = null;
      let targetName = 'الترتيب العام (كافة المراحل)';

      if (filterId.startsWith('group:')) {
        mode = 'group';
        targetId = filterId.split(':')[1];
        const g = cacheGroups.find(grp => grp.id === targetId);
        if (g) targetName = g.name;
      } else if (filterId.startsWith('stage:')) {
        mode = 'stage';
        targetId = filterId.split(':')[1];
        const s = cacheStages.find(stg => stg.id === targetId);
        if (s) targetName = 'مرحلة ' + s.name;
      }

      // 1. Supabase Realtime Broadcast message
      if (realtimeChannel) {
        try {
          realtimeChannel.send({
            type: 'broadcast',
            event: 'display_command',
            payload: {
              action: 'set_filter',
              filterKey: filterId,
              mode: mode,
              targetId: targetId,
              slideshow: slideshowActive,
              intervalSec: intervalSec
            }
          });
        } catch(e) {
          console.warn('Realtime broadcast error:', e);
        }
      }

      // 2. Cross-tab BroadcastChannel
      try {
        if ('BroadcastChannel' in window) {
          const bc = new BroadcastChannel('church_display_sync');
          bc.postMessage({
            action: 'set_filter',
            filterKey: filterId,
            mode: mode,
            targetId: targetId,
            slideshow: slideshowActive,
            intervalSec: intervalSec
          });
          bc.close();
        }
      } catch(e) {}

      // 3. Supabase DB write
      if (supabaseClient) {
        try {
          await supabaseClient.from('display_settings').upsert({
            id: 'current_display_config',
            mode: mode,
            target_id: targetId,
            slideshow_active: slideshowActive,
            slideshow_interval_seconds: intervalSec,
            updated_at: new Date().toISOString()
          });
        } catch(e) {
          console.warn('display_settings upsert error:', e);
        }
      }

      showToast(`✓ تم بث (${targetName}) بنجاح إلى جميع شاشات العرض!`, true);
      renderAdminDashboard();
    }

    function broadcastConfettiTrigger() {
      if (realtimeChannel) {
        try {
          realtimeChannel.send({
            type: 'broadcast',
            event: 'display_command',
            payload: { action: 'confetti' }
          });
        } catch(e) {}
      }
      try {
        if ('BroadcastChannel' in window) {
          const bc = new BroadcastChannel('church_display_sync');
          bc.postMessage({ action: 'confetti' });
          bc.close();
        }
      } catch(e) {}
      triggerConfetti();
      showToast('🎉 تم إطلاق الاحتفال والكونفيتي على جميع شاشات العرض الآن!', true);
    }

    function broadcastStartSlideshow() {
      broadcastDisplayFilter('all', true, displaySlideshowIntervalSec);
    }

    function broadcastStopSlideshow() {
      broadcastDisplayFilter(selectedDisplayFilter, false, displaySlideshowIntervalSec);
    }

    function changeSlideshowInterval(sec) {
      displaySlideshowIntervalSec = sec;
      if (isDisplaySlideshowActive) {
        broadcastDisplayFilter(selectedDisplayFilter, true, sec);
      } else {
        renderAdminDashboard();
      }
    }

    function handleRemoteDisplayCommand(cmd) {
      if (!cmd) return;
      if (cmd.action === 'confetti') {
        triggerConfetti();
        return;
      }
      if (cmd.action === 'set_filter' || cmd.filterKey) {
        selectedDisplayFilter = cmd.filterKey || 'all';
        localStorage.setItem('CHURCH_DISPLAY_FILTER', selectedDisplayFilter);
        if (cmd.slideshow) {
          startDisplaySlideshow();
        } else {
          stopDisplaySlideshow();
        }
        if (isDisplayOnlyMode) {
          renderDisplayScreen();
        }
      }
    }

    function applyRemoteDisplaySettingsRow(row) {
      if (!row) return;
      let fKey = 'all';
      if (row.mode === 'group' && row.target_id) fKey = 'group:' + row.target_id;
      else if (row.mode === 'stage' && row.target_id) fKey = 'stage:' + row.target_id;
      selectedDisplayFilter = fKey;
      localStorage.setItem('CHURCH_DISPLAY_FILTER', fKey);
      if (row.slideshow_interval_seconds) {
        displaySlideshowIntervalSec = row.slideshow_interval_seconds;
      }
      if (row.slideshow_active) {
        startDisplaySlideshow();
      } else {
        stopDisplaySlideshow();
      }
      if (isDisplayOnlyMode) {
        renderDisplayScreen();
      }
    }

    // Cross-tab broadcast listener
    try {
      if ('BroadcastChannel' in window) {
        const globalDisplayBc = new BroadcastChannel('church_display_sync');
        globalDisplayBc.onmessage = (e) => {
          handleRemoteDisplayCommand(e.data);
        };
      }
    } catch(e) {}

    // Storage event listener
    window.addEventListener('storage', (e) => {
      if (e.key === 'CHURCH_DISPLAY_FILTER' && e.newValue) {
        selectedDisplayFilter = e.newValue;
        if (isDisplayOnlyMode) renderDisplayScreen();
      }
    });

    function showToast(message, isPositive = true) {
      const existing = document.getElementById('toast-notification');
      if (existing) existing.remove();

      const toast = document.createElement('div');
      toast.id = 'toast-notification';
      toast.className = `fixed top-5 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-2xl shadow-2xl border font-black text-xs sm:text-sm flex items-center gap-2.5 transition-all transform animate-bounce ${isPositive ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-rose-600 text-white border-rose-500'}`;
      toast.innerHTML = `<span>${isPositive ? '🎉' : '⚠️'}</span> <span>${message}</span>`;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translate(-50%, -20px)';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    async function executeConfirmedPoint(childId, ruleId) {
      const child = cacheChildren.find(c => c.id === childId);
      const rule = cacheRules.find(r => r.id === ruleId);
      if (!child || !rule || !currentUser || !supabaseClient) return;

      const btn = document.getElementById('btn-confirm-point');
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'جاري التسجيل...';
      }

      const rTitle = rule.name || rule.title;
      const isAdd = rule.type === 'add';
      const pts = rule.points;

      try {
        const insertPayload = {
          child_id: child.id,
          family_id: child.family_id,
          stage_id: child.stage_id,
          rule_id: rule.id,
          points: pts,
          reason: rTitle,
          servant_id: currentUser.id
        };

        // 1. Instant Optimistic UI Update (0.00 seconds delay)
        const optimisticLog = {
          id: 'temp-' + Date.now(),
          ...insertPayload,
          created_at: new Date().toISOString(),
          is_reverted: false,
          child: child,
          family: child.family || cacheFamilies.find(f => f.id === child.family_id),
          stage: child.stage || cacheStages.find(s => s.id === child.stage_id),
          servant: currentProfile || { full_name: 'خادم' }
        };

        // Prepend immediately to cacheLogs
        cacheLogs.unshift(optimisticLog);

        // Close modal immediately
        document.getElementById('modal-point-box')?.remove();

        // Sound & Confetti feedback
        if (isAdd) {
          sounds.playSuccess();
          triggerConfetti();
          showToast(`✅ تم إضافة ${pts} نقطة لـ (${child.full_name})`, true);
        } else {
          sounds.playDeduct();
          showToast(`⚠️ تم خصم ${Math.abs(pts)} نقطة من (${child.full_name})`, false);
        }

        // Refresh UI at the EXACT SAME INSTANT
        refreshCurrentView();

        // 2. Perform database insert in Supabase
        const { data: insertedRows, error } = await supabaseClient
          .from('point_logs')
          .insert(insertPayload)
          .select();

        if (error) {
          console.error('[executeConfirmedPoint error]:', error);
          // Rollback optimistic item if insert failed
          const idx = cacheLogs.findIndex(l => l.id === optimisticLog.id);
          if (idx !== -1) cacheLogs.splice(idx, 1);
          refreshCurrentView();
          throw error;
        }

        // Replace temporary ID with real database ID
        if (insertedRows && insertedRows[0]) {
          optimisticLog.id = insertedRows[0].id;
        }

        // Background reload to sync fully
        loadAllData().then(() => refreshCurrentView());
      } catch (err) {
        console.error('Point insert error:', err);
        alert(err.message || 'فشل تسجيل النقطة في Supabase، تأكد من صلاحيات الخادم وتنفيذ ملف SQL');
        if (btn) {
          btn.disabled = false;
          btn.textContent = isAdd ? '✓ تأكيد إضافة النقاط' : '⚠️ تأكيد الخصم';
        }
      }
    }

      if (!confirm('هل تريد التراجع عن هذه العملية؟')) return;
      try {
        const { error } = await supabaseClient.from('point_logs').update({
          is_reverted: true,
          reverted_at: new Date().toISOString(),
          reverted_by: currentUser.id,
          revert_reason: 'تراجع من الخادم'

        await loadAllData();
        refreshCurrentView();
      } catch (err) {
        alert(err.message || 'فشل التراجع');

    }

    async function compressImageFile(file, maxDimension = 600, quality = 0.8) {
      return new Promise((resolve) => {
        if (!file || !file.type.startsWith('image/')) {
          return resolve(file);
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxDimension) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
              }
            } else {
              if (height > maxDimension) {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob((blob) => {
              resolve(blob || file);
            }, 'image/jpeg', quality);
          };
          img.onerror = () => resolve(file);
          img.src = e.target.result;
        };
        reader.onerror = () => resolve(file);
        reader.readAsDataURL(file);
      });
    }

    async function uploadChildPhoto(file, childId) {
      if (!file || !supabaseClient) return null;
      try {
        const compressedBlob = await compressImageFile(file, 600, 0.8);
        const fileName = `children/child_${childId || 'new'}_${Date.now()}.jpg`;

        const { data, error } = await supabaseClient.storage
          .from('sunday_school_media')
          .upload(fileName, compressedBlob, {
            cacheControl: '3600',
            upsert: true,
            contentType: 'image/jpeg'
          });

        if (error) {
          console.warn('[Storage upload notice]:', error);
          return new Promise((resolve) => {
            const r = new FileReader();
            r.onload = () => resolve(r.result);
            r.onerror = () => resolve(null);
            r.readAsDataURL(compressedBlob);
          });
        }

        const { data: publicData } = supabaseClient.storage
          .from('sunday_school_media')
          .getPublicUrl(fileName);

        return publicData?.publicUrl || null;
      } catch (err) {
        console.warn('Upload image error:', err);
        return null;
      }
    }

    function previewChildImageFile(input) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];
      pendingChildPhotoFile = file;
      pendingChildPhotoDelete = false;

      const reader = new FileReader();
      reader.onload = (e) => {
        const preview = document.getElementById('child-preview-img');
        const placeholder = document.getElementById('child-preview-placeholder');
        const removeBtn = document.getElementById('child-remove-img-btn');
        if (preview) {
          preview.src = e.target.result;
          preview.classList.remove('hidden');
        }
        if (placeholder) placeholder.classList.add('hidden');
        if (removeBtn) removeBtn.classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    function removeChildImage() {
      pendingChildPhotoFile = null;
      pendingChildPhotoDelete = true;
      const preview = document.getElementById('child-preview-img');
      const placeholder = document.getElementById('child-preview-placeholder');
      const removeBtn = document.getElementById('child-remove-img-btn');
      if (preview) {
        preview.src = '';
        preview.classList.add('hidden');
      }
      if (placeholder) placeholder.classList.remove('hidden');
      if (removeBtn) removeBtn.classList.add('hidden');
    }

    function handleModalFamilyChange(famId) {
      const fam = cacheFamilies.find(f => f.id === famId);
      const stageSelect = document.getElementById('cf-stage');
      if (fam && stageSelect) {
        stageSelect.value = fam.stage_id;
      }
    }

    async function handleSaveChildForm(e, childId) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit-child');
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'جاري المعالجة والرفع...';
      }

      const isEdit = !!childId;
      const full_name = document.getElementById('cf-name').value.trim();
      const family_id = document.getElementById('cf-family').value;
      const stage_id = document.getElementById('cf-stage').value;
      const birth_date = document.getElementById('cf-birth')?.value || null;
      const phone = document.getElementById('cf-phone')?.value.trim() || null;
      const activeCheckbox = document.getElementById('cf-active');
      const is_active = activeCheckbox ? activeCheckbox.checked : true;

      // Security check on client
      if (currentRole !== 'admin' && !assignedFamilyIds.includes(family_id)) {
        alert('غير مصرح لك بإضافة طفل لأسرة غير مسندة إليك');
        if (btn) { btn.disabled = false; btn.textContent = '✓ حفظ'; }
        return;
      }

      try {
        let image_url = isEdit ? (cacheChildren.find(c => c.id === childId)?.image_url || null) : null;

        if (pendingChildPhotoDelete) {
          image_url = null;
        }

        if (pendingChildPhotoFile) {
          const uploaded = await uploadChildPhoto(pendingChildPhotoFile, childId);
          if (uploaded) {
            image_url = uploaded;
          }
        }

        const payload = {
          full_name,
          family_id,
          stage_id,
          birth_date,
          phone,
          is_active,
          image_url,
          updated_at: new Date().toISOString()
        };

        if (isEdit) {
          const { data, error } = await supabaseClient
            .from('children')
            .update(payload)
            .eq('id', childId)
            .select();

          if (error) throw error;

          const idx = cacheChildren.findIndex(c => c.id === childId);
          if (idx !== -1) {
            cacheChildren[idx] = {
              ...cacheChildren[idx],
              ...payload,
              family: cacheFamilies.find(f => f.id === family_id),
              stage: cacheStages.find(s => s.id === stage_id)
            };
          }
          showToast(`تم تعديل بيانات الطفل (${full_name}) بنجاح`, true);
        } else {
          const { data, error } = await supabaseClient
            .from('children')
            .insert({
              ...payload,
              code: 'KID-' + Math.floor(1000 + Math.random() * 9000)
            })
            .select();

          if (error) throw error;

          const newKid = (data && data[0]) ? data[0] : {
            id: 'child-' + Date.now(),
            ...payload
          };
          newKid.family = cacheFamilies.find(f => f.id === family_id);
          newKid.stage = cacheStages.find(s => s.id === stage_id);

          cacheChildren.unshift(newKid);
          showToast(`تمت إضافة الطفل (${full_name}) بنجاح`, true);
        }

        document.getElementById('modal-child-form')?.remove();
        refreshCurrentView();
        loadAllData().then(() => refreshCurrentView());
      } catch (err) {
        console.error('Save child error:', err);
        alert(err.message || 'فشل حفظ بيانات الطفل، تأكد من صلاحيات الأسرة في قاعدة البيانات');
        if (btn) {
          btn.disabled = false;
          btn.textContent = isEdit ? '✓ حفظ التعديلات' : '✓ إضافة الطفل';
        }
      }
    }

    async function handleDeleteChild(childId) {
      const child = cacheChildren.find(c => c.id === childId);
      if (!child) return;

      if (currentRole !== 'admin') {
        alert('عذراً، فقط مدير النظام (Admin) يملك صلاحية حذف طفل نهائياً.');
        return;
      }

      if (!confirm(`هل أنت متأكد من حذف الطفل (${child.full_name}) نهائياً؟`)) return;

      try {
        const { error } = await supabaseClient.from('children').delete().eq('id', childId);
        if (error) throw error;

        cacheChildren = cacheChildren.filter(c => c.id !== childId);
        showToast(`تم حذف الطفل (${child.full_name})`, true);
        refreshCurrentView();
        loadAllData().then(() => refreshCurrentView());
      } catch (err) {
        alert(err.message || 'فشل حذف الطفل');
      }
    }

                      </td>

                      </td>
                      <td class="p-3 text-slate-600">
                        ${p.role === 'admin' ? '<span class="text-amber-600 font-bold">جميع الأسر</span>' : (myFamNames || '<span class="text-slate-400">لا يوجد</span>')}

                      <td class="p-3 text-left">
                        ${p.role === 'servant' ? `
                          <div class="flex items-center gap-1.5 justify-end">

                            </button>
                          </div>
                        ` : ''}
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>

      `;

    async function approveUser(userId) {
      try {
        // Try calling the stored RPC which confirms email in auth.users AND approves profile
        const { error: rpcErr } = await supabaseClient.rpc('approve_user', { target_user_id: userId });
        if (rpcErr) {
          console.warn('RPC approve_user note:', rpcErr);
          // Fallback direct update
          const { error } = await supabaseClient.from('profiles').update({ is_approved: true }).eq('id', userId);
          if (error) throw error;
        }
        await loadAllData();
        renderAdminDashboard();
      } catch (err) {
        alert(err.message || 'فشل اعتماد المستخدم');
      }
    }

    async function updateUserRole(userId, newRole) {
      try {
        const { error } = await supabaseClient.from('profiles').update({ role: newRole }).eq('id', userId);
        if (error) throw error;
        await loadAllData();
        renderAdminDashboard();
      } catch (err) {
        alert(err.message || 'فشل تحديث الدور');
      }
    }

      const modal = document.createElement('div');
      modal.id = 'modal-assign-box';
      modal.className = 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm';
      modal.innerHTML = `
        <div class="bg-white w-full max-w-md rounded-3xl p-6 border border-church-200 shadow-2xl space-y-4 text-right">

            <h3 class="font-black text-sm text-slate-900">تخصيص الأسر للخادم: ${servantName}</h3>
            <button onclick="document.getElementById('modal-assign-box').remove()" class="text-slate-400 hover:text-slate-600">✕</button>

          <button onclick="saveFamilyAssignments('${servantId}')" class="w-full py-2.5 rounded-xl bg-church-600 text-white font-bold text-xs shadow-md">

        </div>
      `;

    }

    async function saveFamilyAssignments(servantId) {
      const checkboxes = document.querySelectorAll('.fam-check:checked');
      const selectedFamIds = Array.from(checkboxes).map(c => c.value);

      try {
        await supabaseClient.from('family_servants').delete().eq('servant_id', servantId);
        if (selectedFamIds.length > 0) {
          const rows = selectedFamIds.map(fid => ({ servant_id: servantId, family_id: fid }));
          const { error } = await supabaseClient.from('family_servants').insert(rows);
          if (error) throw error;
        }
        document.getElementById('modal-assign-box')?.remove();
        await loadAllData();
        renderAdminDashboard();
      } catch (err) {
        alert(err.message || 'فشل حفظ التخصيص');
      }
    }

    async function saveServantGroupAssignments(servantId) {
      const checkboxes = document.querySelectorAll('.grp-serv-check:checked');
      const selectedGrpIds = Array.from(checkboxes).map(c => c.value);
      const btn = document.getElementById('btn-save-serv-grp');
      if (btn) {
        btn.disabled = true;
        btn.innerText = 'جاري الحفظ...';
      }

      try {
        await supabaseClient.from('group_servants').delete().eq('servant_id', servantId);
        if (selectedGrpIds.length > 0) {
          const rows = selectedGrpIds.map(gid => ({ servant_id: servantId, group_id: gid }));
          const { error } = await supabaseClient.from('group_servants').insert(rows);
          if (error) throw error;
        }
        document.getElementById('modal-assign-grp-box')?.remove();
        await loadAllData();
        renderAdminDashboard();
        showToast('✓ تم حفظ تخصيص المجموعات للخادم', true);
      } catch (err) {
        alert(err.message || 'فشل حفظ تخصيص المجموعات');
        if (btn) {
          btn.disabled = false;
          btn.innerText = 'حفظ التخصيص';
        }
      }
    }

    async function handleSaveGroup(e, existingId) {
      e.preventDefault();
      const name = document.getElementById('grp-input-name').value.trim();
      const description = document.getElementById('grp-input-desc').value.trim();
      const is_active = document.getElementById('grp-input-active').checked;
      const stageChecks = document.querySelectorAll('.grp-stage-check:checked');
      const selectedStageIds = Array.from(stageChecks).map(c => c.value);

      if (!name) {
        alert('يرجى إدخال اسم المجموعة');
        return;
      }

      const saveBtn = document.getElementById('btn-save-grp');
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerText = 'جاري الحفظ...';
      }

      try {
        let groupId = existingId;
        if (existingId) {
          const { error } = await supabaseClient
            .from('groups')
            .update({ name, description, is_active, updated_at: new Date().toISOString() })
            .eq('id', existingId);
          if (error) throw error;
        } else {
          const { data, error } = await supabaseClient
            .from('groups')
            .insert({ name, description, is_active })
            .select()
            .single();
          if (error) throw error;
          groupId = data.id;
        }

        // Update group_stages (many-to-many)
        await supabaseClient.from('group_stages').delete().eq('group_id', groupId);
        if (selectedStageIds.length > 0) {
          const rows = selectedStageIds.map(stgId => ({ group_id: groupId, stage_id: stgId }));
          const { error: gsErr } = await supabaseClient.from('group_stages').insert(rows);
          if (gsErr) throw gsErr;
        }

        document.getElementById('modal-group-box')?.remove();
        await loadAllData();
        renderAdminDashboard();
        showToast('✓ تم حفظ إعدادات المجموعة بنجاح', true);
      } catch (err) {
        alert(err.message || 'فشل حفظ المجموعة');
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.innerText = 'حفظ';
        }
      }
    }

    async function toggleGroupActive(groupId, currentActive) {
      try {
        const nextState = !currentActive;
        const { error } = await supabaseClient
          .from('groups')
          .update({ is_active: nextState, updated_at: new Date().toISOString() })
          .eq('id', groupId);
        if (error) throw error;

        await loadAllData();
        renderAdminDashboard();
        showToast(nextState ? '✓ تم تفعيل المجموعة' : '⚠️ تم إيقاف المجموعة', true);

        alert(err.message || 'فشل تعديل حالة المجموعة');

    function filterAdminKids(q) {
      const query = q.trim().toLowerCase();
      const famFilter = document.getElementById('admin-kid-family-filter')?.value || '';
      document.querySelectorAll('.admin-kid-row').forEach(row => {
        const name = (row.getAttribute('data-name') || '').toLowerCase();
        const fam = row.getAttribute('data-family') || '';
        const matchName = !query || name.includes(query);
        const matchFam = !famFilter || fam === famFilter;
        row.style.display = (matchName && matchFam) ? '' : 'none';
      });
    }

    function filterAdminKidsByFamily(famId) {
      const query = (document.getElementById('admin-kid-search')?.value || '').trim().toLowerCase();
      document.querySelectorAll('.admin-kid-row').forEach(row => {
        const name = (row.getAttribute('data-name') || '').toLowerCase();
        const fam = row.getAttribute('data-family') || '';
        const matchName = !query || name.includes(query);
        const matchFam = !famId || fam === famId;
        row.style.display = (matchName && matchFam) ? '' : 'none';
      });
    }

    async function handleDeleteChild(childId) {
      if (!confirm('هل أنت متأكد من حذف بيانات هذا الطفل؟')) return;
      try {
        const { error } = await supabaseClient.from('children').delete().eq('id', childId);
        if (error) throw error;
        await loadAllData();
        renderAdminDashboard();
      } catch (err) {
        alert(err.message || 'فشل حذف الطفل');
      }
    }

    async function handleCreateRule(e) {
      e.preventDefault();
      const title = document.getElementById('rule-title').value.trim();
      const type = document.getElementById('rule-type').value;
      let rawPoints = Math.abs(parseInt(document.getElementById('rule-points').value) || 1);
      const points = (type === 'deduct') ? -rawPoints : rawPoints;
      const description = document.getElementById('rule-desc').value.trim();

      try {
        const { error } = await supabaseClient.from('point_rules').insert({
          title,
          name: title,
          type,
          points,
          description,
          is_active: true
        });
        if (error) throw error;
        showToast(`تمت إضافة قاعدة (${title}) بنجاح`, true);
        await loadAllData();
        renderAdminDashboard();
      } catch (err) {
        alert(err.message || 'فشل حفظ القاعدة');
      }
    }

    async function toggleRuleActive(ruleId, newActiveState) {
      try {
        const { error } = await supabaseClient.from('point_rules').update({ is_active: newActiveState }).eq('id', ruleId);
        if (error) throw error;
        showToast(newActiveState ? 'تم تفعيل القاعدة بنجاح' : 'تم تعطيل القاعدة بنجاح', true);
        await loadAllData();
        renderAdminDashboard();
      } catch (err) {
        alert(err.message || 'فشل تغيير حالة القاعدة');
      }
    }

              </button>
              <button type="submit" class="px-5 py-2 rounded-xl bg-church-600 hover:bg-church-700 text-white text-xs font-black shadow-md">
                حفظ التعديلات
              </button>
            </div>
          </form>
        </div>
      `;
      document.body.appendChild(modal);
    }

    async function handleSaveEditRule(e, ruleId) {
      e.preventDefault();
      const title = document.getElementById('edit-rule-title').value.trim();
      const type = document.getElementById('edit-rule-type').value;
      let rawPoints = Math.abs(parseInt(document.getElementById('edit-rule-points').value) || 1);
      const points = (type === 'deduct') ? -rawPoints : rawPoints;
      const description = document.getElementById('edit-rule-desc').value.trim();

      try {
        const { error } = await supabaseClient.from('point_rules').update({
          title,
          name: title,
          type,
          points,
          description,
          updated_at: new Date().toISOString()
        }).eq('id', ruleId);

        if (error) throw error;
        document.getElementById('modal-edit-rule')?.remove();
        showToast('تم تعديل قاعدة النقاط بنجاح', true);
        await loadAllData();
        renderAdminDashboard();
      } catch (err) {
        alert(err.message || 'فشل تعديل القاعدة');
      }
    }

    async function handleDeleteRule(ruleId) {
      if (!confirm('هل تريد حذف قاعدة النقاط هذه؟ إذا كانت مرتبطة بسجلات سابقة سيتم تعطيلها أو إزالتها.')) return;
      try {
        const { error } = await supabaseClient.from('point_rules').delete().eq('id', ruleId);
        if (error) {
          // If foreign key constraint prevents deletion, offer to disable it
          if (confirm('هذه القاعدة مرتبطة بعمليات مسجلة سابقاً، هل تريد تعطيلها بدلاً من الحذف؟')) {
            await toggleRuleActive(ruleId, false);
            return;
          }
          throw error;
        }
        showToast('تم حذف قاعدة النقاط', true);
        await loadAllData();
        renderAdminDashboard();
      } catch (err) {
        alert(err.message || 'فشل حذف القاعدة');
      }
    }

    // 7.7 AUDIT LOGS TAB (WITH ADVANCED MULTI-FIELD FILTERS)
    let filteredAuditLogs = null;

    function renderAdminAudit() {
      const logs = filteredAuditLogs !== null ? filteredAuditLogs : cacheLogs;
      const servantsList = cacheProfiles.filter(p => p.role === 'servant' || p.role === 'admin');

      return `
        <div class="bg-white rounded-3xl p-6 border border-church-200 shadow-sm space-y-4">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-church-100 pb-4">
            <div>
              <h3 class="font-black text-base text-slate-900">📋 سجل النقاط وعمليات التدقيق</h3>
              <p class="text-xs text-slate-500">عرض العمليات لحظياً من Supabase مع إمكانية التصفية المتقدمة</p>
            </div>
            <span class="text-xs font-bold text-church-800 bg-church-50 border border-church-200 px-3 py-1 rounded-xl">
              إجمالي المعروض: <span id="audit-count" class="font-black">${logs.length}</span> عملية
            </span>
          </div>

          <!-- FILTERS TOOLBAR -->
          <div class="p-4 bg-church-50/60 rounded-2xl border border-church-200 space-y-3">
            <div class="text-xs font-black text-church-900 flex items-center justify-between">
              <span>🔍 تصفية وفلترة العمليات:</span>
              <button onclick="resetAuditFilters()" class="text-church-600 hover:text-church-800 text-[11px] underline">
                إعادة ضبط الفلاتر
              </button>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2 text-xs">
              <!-- 1. Child search -->
              <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-1">الطفل:</label>
                <input id="audit-f-child" oninput="applyAuditFilters()" type="text" placeholder="اسم الطفل..." class="w-full px-2.5 py-1.5 rounded-xl border border-church-300 text-xs bg-white" />
              </div>

              <!-- 2. Family filter -->
              <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-1">الأسرة:</label>
                <select id="audit-f-family" onchange="applyAuditFilters()" class="w-full px-2 py-1.5 rounded-xl border border-church-300 text-xs bg-white">
                  <option value="">جميع الأسر</option>
                  ${cacheFamilies.map(f => `<option value="${f.id}">${f.name}</option>`).join('')}
                </select>
              </div>

              <!-- 3. Stage filter -->
              <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-1">المرحلة:</label>
                <select id="audit-f-stage" onchange="applyAuditFilters()" class="w-full px-2 py-1.5 rounded-xl border border-church-300 text-xs bg-white">
                  <option value="">جميع المراحل</option>
                  ${cacheStages.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
                </select>
              </div>

              <!-- 4. Servant filter -->
              <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-1">الخادم:</label>
                <select id="audit-f-servant" onchange="applyAuditFilters()" class="w-full px-2 py-1.5 rounded-xl border border-church-300 text-xs bg-white">
                  <option value="">جميع الخدام</option>
                  ${servantsList.map(s => `<option value="${s.id}">${s.full_name}</option>`).join('')}
                </select>
              </div>

              <!-- 5. Type filter (add / deduct) -->
              <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-1">نوع العملية:</label>
                <select id="audit-f-type" onchange="applyAuditFilters()" class="w-full px-2 py-1.5 rounded-xl border border-church-300 text-xs bg-white font-bold">
                  <option value="">الكل (إضافة وخصم)</option>
                  <option value="add">➕ إضافة فقط</option>
                  <option value="deduct">➖ خصم فقط</option>
                </select>
              </div>

              <!-- 6. Date filter -->
              <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-1">الفترة الزمنية:</label>
                <select id="audit-f-period" onchange="handlePeriodChange(this.value)" class="w-full px-2 py-1.5 rounded-xl border border-church-300 text-xs bg-white font-bold">
                  <option value="all">كل الأوقات</option>
                  <option value="today" selected>عمليات اليوم</option>
                  <option value="custom">تاريخ محدد...</option>
                </select>
                <input id="audit-f-custom-date" onchange="applyAuditFilters()" type="date" class="w-full mt-1 px-2 py-1 rounded-lg border border-church-300 text-xs bg-white hidden" />
              </div>
            </div>
          </div>

          <!-- AUDIT TABLE -->
          <div class="overflow-x-auto max-h-[600px] overflow-y-auto">
            <table class="w-full text-right text-xs">
              <thead class="bg-church-50 text-slate-600 font-bold border-b border-church-200 sticky top-0 z-10">
                <tr>
                  <th class="p-3">التاريخ</th>
                  <th class="p-3">الوقت</th>
                  <th class="p-3">الطفل</th>
                  <th class="p-3">الأسرة</th>
                  <th class="p-3">المرحلة</th>
                  <th class="p-3">البند / السبب</th>
                  <th class="p-3">النقاط</th>
                  <th class="p-3">الخادم المسؤول</th>
                  <th class="p-3">الحالة</th>
                  <th class="p-3 text-left">إجراء</th>
                </tr>
              </thead>
              <tbody id="audit-tbody" class="divide-y divide-church-100">
                ${renderAuditRows(logs)}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderAuditRows(logs) {
      if (!logs || logs.length === 0) {
        return `<tr><td colspan="10" class="text-center p-8 text-slate-400 font-bold">لا توجد عمليات مطابقة للفلاتر الحالية</td></tr>`;
      }

      return logs.map(l => {
        const d = new Date(l.created_at);
        const dateStr = d.toLocaleDateString('ar-EG');
        const timeStr = d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        const isPos = l.points > 0;

        return `
          <tr class="hover:bg-church-50/40 ${l.is_reverted ? 'opacity-40 line-through bg-rose-50/30' : ''}">
            <td class="p-3 font-mono text-slate-500 text-[11px]">${dateStr}</td>
            <td class="p-3 font-mono text-slate-400 text-[11px]">${timeStr}</td>
            <td class="p-3 font-black text-slate-900">
              ${l.child_id ? (l.child?.full_name || 'طفل') : `<span class="px-2 py-0.5 rounded-lg bg-amber-100 text-amber-900 font-black text-[10px] border border-amber-300 inline-flex items-center gap-1">⭐ نقاط للأسرة</span>`}
            </td>
            <td class="p-3 text-church-700 font-bold">${l.family?.name || ''}</td>
            <td class="p-3 text-slate-500">${l.stage?.name || ''}</td>
            <td class="p-3 text-slate-700 font-medium">${l.reason}</td>
            <td class="p-3 font-black text-sm ${isPos ? 'text-emerald-600' : 'text-rose-600'}">
              ${isPos ? '+' + l.points : l.points}
            </td>
            <td class="p-3 text-slate-700 font-bold">${l.servant?.full_name || 'خادم'}</td>
            <td class="p-3">
              ${l.is_reverted ? '<span class="px-2 py-0.5 rounded-full bg-rose-100 text-rose-700 text-[9px] font-bold">ملغية</span>' : '<span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-[9px] font-bold">نشطة</span>'}
            </td>
            <td class="p-3 text-left">
              ${!l.is_reverted ? `
                <button onclick="revertPointLog('${l.id}')" class="px-2.5 py-1 rounded-lg border border-rose-200 text-rose-600 hover:bg-rose-50 font-bold text-[10px] shadow-2xs">
                  تراجع
                </button>
              ` : '<span class="text-[10px] text-slate-400 font-bold">تم الإلغاء</span>'}
            </td>
          </tr>
        `;
      }).join('');
    }

    function handlePeriodChange(val) {
      const customInput = document.getElementById('audit-f-custom-date');
      if (customInput) {
        customInput.classList.toggle('hidden', val !== 'custom');
      }
      applyAuditFilters();
    }

    function applyAuditFilters() {
      const childQ = (document.getElementById('audit-f-child')?.value || '').trim().toLowerCase();
      const famId = document.getElementById('audit-f-family')?.value || '';
      const stgId = document.getElementById('audit-f-stage')?.value || '';
      const srvId = document.getElementById('audit-f-servant')?.value || '';
      const typeVal = document.getElementById('audit-f-type')?.value || '';
      const periodVal = document.getElementById('audit-f-period')?.value || 'all';
      const customDate = document.getElementById('audit-f-custom-date')?.value || '';

      const now = new Date();
      const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();

      filteredAuditLogs = cacheLogs.filter(l => {
        if (childQ && !(l.child?.full_name || '').toLowerCase().includes(childQ)) return false;
        if (famId && l.family_id !== famId) return false;
        if (stgId && l.stage_id !== stgId) return false;
        if (srvId && l.servant_id !== srvId) return false;
        if (typeVal === 'add' && l.points <= 0) return false;
        if (typeVal === 'deduct' && l.points >= 0) return false;

        const time = new Date(l.created_at).getTime();
        if (periodVal === 'today' && time < startOfToday) return false;
        if (periodVal === 'custom' && customDate) {
          const logDate = new Date(l.created_at).toISOString().split('T')[0];
          if (logDate !== customDate) return false;
        }

        return true;
      });

      const tbody = document.getElementById('audit-tbody');
      const countSpan = document.getElementById('audit-count');
      if (tbody) tbody.innerHTML = renderAuditRows(filteredAuditLogs);
      if (countSpan) countSpan.textContent = filteredAuditLogs.length;
    }

    function resetAuditFilters() {
      filteredAuditLogs = null;
      const c = document.getElementById('audit-f-child'); if (c) c.value = '';
      const f = document.getElementById('audit-f-family'); if (f) f.value = '';
      const s = document.getElementById('audit-f-stage'); if (s) s.value = '';
      const srv = document.getElementById('audit-f-servant'); if (srv) srv.value = '';
      const t = document.getElementById('audit-f-type'); if (t) t.value = '';
      const p = document.getElementById('audit-f-period'); if (p) p.value = 'all';
      const cd = document.getElementById('audit-f-custom-date'); if (cd) { cd.value = ''; cd.classList.add('hidden'); }
      applyAuditFilters();
    }

    // Initialize as soon as DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }

    // Register PWA Service Worker for mobile app installability
    if ('serviceWorker' in navigator && (window.location.protocol.startsWith('http') || window.location.protocol === 'file:')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => {
          console.log('[PWA SW note]:', err);
        });
      });
    }
  </script>
</body>
</html>
